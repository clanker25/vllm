tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
vllm-bench.workspace = false
vllm-build-info.workspace = false
vllm-chat.workspace = true
vllm-engine-core-client.workspace = true
vllm-managed-engine.workspace = true
vllm-server.workspace = true
vllm-text.workspace = false
vllm-tracing.workspace = false

[dev-dependencies]
expect-test.workspace = true

[lints]
workspace = true
